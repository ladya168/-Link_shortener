version: '3.8'

services:
  db:
    image: dockerhub.timeweb.cloud/library/postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    hostname: db
    ports:
      - "6432:5432"
    networks:
      - project
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  project_back:
    image: dockerhub.timeweb.cloud/library/python:3.13-slim
    ports:
      - "8000:8000"
    networks:
      - project
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -c "pip install uv && 
             uv sync --frozen --no-cache && 
             uv run uvicorn main:app --host 0.0.0.0 --port 8000"

  project_front:
    image: dockerhub.timeweb.cloud/library/nginx:alpine
    ports:
      - "80:80"
    networks:
      - project
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  postgres_data:

networks:
  project:
    driver: bridge
